<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TayTech Insights | Personal News, Insights & Opinions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="tag">taytechinsights</p>
      <h1>Personal News, Insights & Opinions</h1>
      <p class="intro">A modern personal news-style blog to share updates, ideas, and perspective in one place.</p>
    </div>
  </header>

  <main class="container main-layout">
    <section class="featured">
      <h2>Featured Story</h2>
      <article id="featured-story" class="featured-card"></article>
    </section>

    <section class="publish">
      <h2>Share Your Post</h2>
      <form id="post-form" class="post-form">
        <label>
          Title
          <input type="text" id="title" required maxlength="90" placeholder="Write a headline">
        </label>
        <label>
          Category
          <select id="category" required>
            <option value="News">News</option>
            <option value="Insight">Insight</option>
            <option value="Opinion">Opinion</option>
          </select>
        </label>
        <label>
          Author
          <input type="text" id="author" required maxlength="45" placeholder="Your name">
        </label>
        <label>
          Content
          <textarea id="content" required rows="6" maxlength="700" placeholder="Share your update, insight, or opinion"></textarea>
        </label>
        <button type="submit">Publish Post</button>
      </form>
    </section>

    <section class="newsroom">
      <div class="newsroom-head">
        <h2>Latest Posts</h2>
        <label>
          Filter
          <select id="filter">
            <option value="All">All</option>
            <option value="News">News</option>
            <option value="Insight">Insight</option>
            <option value="Opinion">Opinion</option>
          </select>
        </label>
      </div>
      <div id="posts" class="post-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> TayTech Insights</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
